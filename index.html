<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Silsilah Abdul Manan</title>
  <script src="https://unpkg.com/d3@7"></script>
  <script type="module" src="https://unpkg.com/family-chart@0.8.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/family-chart@0.8.1/dist/styles/family-chart.css">
  <style>
    /* === Light theme override for Family Chart === */

    .f3 {
      --background-color: #ffffff !important;
      --text-color: #222222 !important;
      --female-color: #f9c5d1 !important;
      --male-color: #a9c9e7 !important;
      --genderless-color: #e0e0e0 !important;
    }

    /* Chart container background */
    #FamilyChart {
      background-color: var(--background-color) !important;
      color: var(--text-color) !important;
    }

    /* Lines between nodes */
    .f3 .link {
      stroke: rgba(120, 120, 120, 0.6) !important;
    }

    .f3 .link.f3-path-to-main {
      stroke: #000 !important;
    }

    /* Card outlines and shadows */
    .f3 div.card-main .card-inner {
      outline: 4px solid rgba(100, 100, 100, 0.5) !important;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.15) !important;
    }

    /* Card inner backgrounds */
    .f3 div.card-inner {
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1) !important;
    }

    /* Sidebar (form panel) */
    .f3-form-cont {
      background-color: #f5f5f5 !important;
      color: #222 !important;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1) !important;
    }

    /* Sidebar buttons */
    .f3-form button {
      background-color: #007BFF !important;
      color: white !important;
    }

    .f3-form .f3-cancel-btn {
      background-color: #ccc !important;
      color: #333 !important;
    }

    .f3-form .f3-delete-btn {
      border-color: #e74c3c !important;
      color: #e74c3c !important;
    }

    /* Popup modals */
    .f3-modal-content {
      background-color: #fff !important;
      color: #222 !important;
    }

    /* Form inputs */
    .f3-form input[type="text"],
    .f3-form textarea,
    .f3-form select {
      background: #fff !important;
      color: #222 !important;
      border: 1px solid #ccc !important;
    }

    .f3-form input[type="text"]:focus,
    .f3-form textarea:focus,
    .f3-form select:focus {
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.3) !important;
    }

    /* Adjust link hover contrast */
    .f3 div.card:hover>div {
      transform: translate(0, -2px);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.15) !important;
    }
  </style>
</head>

<body>
  <div id="FamilyChart" class="f3"
    style="width:100%;height:900px;margin:auto;background-color:rgb(33,33,33);color:#fff;"></div>
  <script type="module">
    fetch('./data.json')
      .then(res => res.json())
      .then(data => create(data));

    function create(data) {
      const f3Chart = f3.createChart('#FamilyChart', data)
        .setTransitionTime(1000)
        .setCardXSpacing(250)
        .setCardYSpacing(150)
        .setSingleParentEmptyCard(true, { label: 'ADD' })
        .setShowSiblingsOfMain(false)
        .setAncestryDepth(1)
        .setProgenyDepth(1)

      // detect mobile
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      // Set chart orientation based on device
      if (isMobile) {
        f3Chart.setOrientationHorizontal();
      }

      const f3Card = f3Chart.setCardHtml()
        .setCardDisplay([["nama"]])
        .setCardDim(null)
        .setMiniTree(true)
        .setStyle('imageRect')
        .setOnHoverPathToMain()


      if (isMobile) {
        f3Chart.updateTree({ initial: true })
      } else {
        const f3EditTree = f3Chart.editTree()
          .fixed(true)
          .setFields(["nama", "birthday"])
          .setEditFirst(false)
          .setCardClickOpen(f3Card)

        f3EditTree.setNoEdit()

        f3Chart.updateTree({ initial: true })
        f3EditTree.open(f3Chart.getMainDatum())

        f3Chart.updateTree({ initial: true })
      }
    }

  </script>
</body>

</html>
