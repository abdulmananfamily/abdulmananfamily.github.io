<body>
    <div id="FamilyChart" class="f3"
        style="width:100%;height:900px;margin:auto;background-color:rgb(255, 255, 255);color:#fff;"></div>
    <script type="module">
        fetch('./data.json')
            .then(res => res.json())
            .then(data => create(data));

        function create(data) {
            const f3Chart = f3.createChart('#FamilyChart', data)
                .setTransitionTime(1000)
                .setCardXSpacing(250)
                .setCardYSpacing(150)
                .setOrientationVertical()
                .setSingleParentEmptyCard(true, { label: 'ADD' })
                .setOrientationHorizontal()

            const f3Card = f3Chart.setCard(f3.CardHtml)
                .setCardDisplay([["nama", "alamat"]])
                .setCardDim({})
                .setMiniTree(true)
                .setStyle('rect')
                .setOnHoverPathToMain()

            console.log(f3Chart.store)
            // f3Chart.store.setOnUpdate((props) => {
            //     // cutTree(f3Chart.store.state.tree);
            //     // f3.view(f3Chart.store.getTree(), f3Chart.svg, f3Chart.getCard(), props || {})
            //     // f3.view(props || {});
            // });

            function cutTree(tree, max_depth = 1) {
                tree.data = tree.data.filter((d) => {
                    if (d.depth > max_depth) {
                        return false;
                    } else if (d.depth === max_depth) {
                        if (max_depth === 0) {
                            d.parents = [];
                            d.children = [];
                        }
                        if (d.is_ancestry) d.parents = [];
                        else d.children = [];
                    }
                    return true;
                });

                tree.dim = calculateTreeDim(tree.data);

                function calculateTreeDim(
                    tree_data,
                    node_separation = 250,
                    level_separation = 150
                ) {
                    const w_extent = d3.extent(tree_data, (d) => d.x);
                    const h_extent = d3.extent(tree_data, (d) => d.y);
                    return {
                        width: w_extent[1] - w_extent[0] + node_separation,
                        height: h_extent[1] - h_extent[0] + level_separation,
                        x_off: -w_extent[0] + node_separation / 2,
                        y_off: -h_extent[0] + level_separation / 2
                    };
                }
            }

            f3Chart.updateTree({ initial: true })
